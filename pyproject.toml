[project]
name = "r2r"
version = "0.1.0"
description = "Research proposal to publish-ready results with LLM agents and human gates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "docker>=7.2.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "litellm>=1.103.1",
    "pydantic>=2",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
r2r = "r2r.cli:app"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker'"
markers = [
    "docker: needs a running Docker daemon (run with -m docker)",
    "live: calls a paid LLM API; needs R2R_LIVE=1 and owner approval",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Pydantic copies field defaults per instance, so `= []` is safe on contract models.
"src/r2r/contracts/*" = ["RUF012"]
